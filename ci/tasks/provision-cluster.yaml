apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: provision-cluster
spec:
  params:
    - name: CLUSTER_NAME
      description: Cluster name prefix (suffix auto-generated)
      default: upgrd
    - name: INSTALLER
      description: "Provisioning method: aws-ipi, aro, flexy, cluster-platforms, none"
      default: aws-ipi
    - name: BASE_DOMAIN
      default: aws.ospqa.com
    - name: AWS_REGION
      default: us-east-2
    - name: AZURE_LOCATION
      default: eastus
    - name: OPENSHIFT_VERSION
      description: "OCP version (e.g. stable-4.19, 4.15 for ARO)"
      default: stable
    - name: ARCH
      default: linux/amd64
    - name: WORKER_REPLICAS
      default: "3"
    - name: WORKER_TYPE
      default: m5.xlarge
    - name: MASTER_TYPE
      default: m5.xlarge
    - name: CLUSTER_LIFETIME
      description: Tag for orphan cleanup (e.g. 6h)
      default: "6h"
    - name: TEMPLATE
      description: Flexy template path (only used when INSTALLER=flexy)
      default: ""
    - name: LAUNCHER_VARS
      description: JSON config for Flexy template (only used when INSTALLER=flexy)
      default: ""
    - name: GIT_PRIVATE_TEMPLATES_BRANCH
      default: master
    - name: GIT_PRIVATE_TEMPLATES_URI
      default: https://gitlab.cee.redhat.com/aosqe/flexy-templates.git
  results:
    - name: cluster-name
    - name: api-url
    - name: installer
    - name: mirror-registry
      description: URL of mirror registry (disconnected clusters) or quay.io
  stepTemplate:
    env:
      - name: HOME
        value: /tmp
    securityContext:
      runAsNonRoot: true
      runAsUser: 1001
  steps:
    # ============================================================
    # Step 1: AWS IPI provisioning
    # ============================================================
    - name: aws-ipi
      onError: continue
      image: quay.io/openshift-pipeline/ci:latest
      workingDir: /mnt
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-creds
              key: aws-access-key-id
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-creds
              key: aws-secret-access-key
              optional: true
        - name: PULL_SECRET
          valueFrom:
            secretKeyRef:
              name: aws-install-config
              key: pull-secret
              optional: true
        - name: SSH_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: aws-install-config
              key: ssh-public-key
              optional: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        INSTALLER="$(params.INSTALLER)"
        if [[ "${INSTALLER,,}" != "aws-ipi" ]]; then
          echo "INSTALLER=${INSTALLER} — not aws-ipi, skipping"
          exit 0
        fi

        CLUSTER_PREFIX="$(params.CLUSTER_NAME)"

        if oc get secret "cluster-${CLUSTER_PREFIX}" &>/dev/null; then
          REUSE_API=$(oc get secret "cluster-${CLUSTER_PREFIX}" -o go-template='{{index .data "api-url" | base64decode}}' 2>/dev/null || true)
          echo "Secret cluster-${CLUSTER_PREFIX} found (API: ${REUSE_API})"
          if curl -sk --connect-timeout 10 "${REUSE_API}/healthz" &>/dev/null; then
            echo "  Cluster alive — reusing"
            echo -n "${CLUSTER_PREFIX}" > "$(results.cluster-name.path)"
            echo -n "aws-ipi" > "$(results.installer.path)"
            echo -n "${REUSE_API}" > "$(results.api-url.path)"
            exit 0
          else
            echo "  API unreachable — deleting stale secret"
            oc delete secret "cluster-${CLUSTER_PREFIX}" --ignore-not-found
          fi
        fi

        CLUSTER_SUFFIX="$(printf '%(%m%d)T')$(echo '$(context.taskRun.uid)' | cut -c1-3)"
        CLUSTER_NAME="${CLUSTER_PREFIX}${CLUSTER_SUFFIX}"
        CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        # ARCH param = target cluster arch; POD_ARCH = management cluster arch (for binary download)
        TARGET_ARCH="$(echo '$(params.ARCH)' | cut -d/ -f2)"
        [[ -z "$TARGET_ARCH" ]] && TARGET_ARCH=amd64
        POD_ARCH=$(case "$(uname -m)" in aarch64) echo arm64 ;; x86_64) echo amd64 ;; ppc64le) echo ppc64le ;; s390x) echo s390x ;; *) uname -m ;; esac)

        echo "=== Downloading openshift-install (pod arch: ${POD_ARCH}, target arch: ${TARGET_ARCH}) ==="
        MIRROR="https://mirror.openshift.com/pub/openshift-v4/${POD_ARCH}/clients/ocp"
        VERSION="$(params.OPENSHIFT_VERSION)"
        DL_URL="${MIRROR}/${VERSION}"
        [[ "$VERSION" == *dev-preview* ]] && DL_URL="${MIRROR}-${VERSION}"

        INSTALL_ARCHIVE="openshift-install-linux.tar.gz"
        if [[ "$TARGET_ARCH" != "$POD_ARCH" ]]; then
          echo "Cross-arch provisioning: pod=${POD_ARCH}, target=${TARGET_ARCH}"
          # Get the exact version from the release.txt, then use the -multi tag
          OCP_VER=$(curl -sL "${DL_URL}/release.txt" 2>/dev/null \
            | sed -n 's/^Name:[[:space:]]*//p' | head -1) || true
          if [[ -n "$OCP_VER" ]]; then
            MULTI_IMAGE="quay.io/openshift-release-dev/ocp-release:${OCP_VER}-multi"
            export OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE="$MULTI_IMAGE"
            echo "Using multi-arch release: ${MULTI_IMAGE}"
          else
            echo "ERROR: Could not determine OCP version for multi-arch release"
            echo "  Cross-arch provisioning (${POD_ARCH} → ${TARGET_ARCH}) requires multi-arch release image"
            exit 1
          fi
        fi
        echo "Downloading ${DL_URL}/${INSTALL_ARCHIVE}"
        curl -sfL "${DL_URL}/${INSTALL_ARCHIVE}" | tar xz -C /usr/local/bin openshift-install
        openshift-install version

        # Select instance types based on target architecture
        WORKER_TYPE="$(params.WORKER_TYPE)"
        MASTER_TYPE="$(params.MASTER_TYPE)"
        if [[ "$TARGET_ARCH" == "arm64" ]]; then
          [[ "$WORKER_TYPE" == m5.* ]] && WORKER_TYPE="${WORKER_TYPE/m5./m6g.}"
          [[ "$MASTER_TYPE" == m5.* ]] && MASTER_TYPE="${MASTER_TYPE/m5./m6g.}"
          echo "ARM64 target — instance types: worker=${WORKER_TYPE}, master=${MASTER_TYPE}"
        fi

        echo "=== Generating install-config.yaml ==="
        mkdir -p install-dir
        cat > install-dir/install-config.yaml <<EOCFG
        apiVersion: v1
        baseDomain: $(params.BASE_DOMAIN)
        metadata:
          name: ${CLUSTER_NAME}
        compute:
        - architecture: ${TARGET_ARCH}
          hyperthreading: Enabled
          name: worker
          replicas: $(params.WORKER_REPLICAS)
          platform:
            aws:
              type: ${WORKER_TYPE}
        controlPlane:
          architecture: ${TARGET_ARCH}
          hyperthreading: Enabled
          name: master
          replicas: 3
          platform:
            aws:
              type: ${MASTER_TYPE}
        networking:
          networkType: OVNKubernetes
          clusterNetwork:
          - cidr: 10.128.0.0/14
            hostPrefix: 23
          machineNetwork:
          - cidr: 10.0.0.0/16
          serviceNetwork:
          - 172.30.0.0/16
        platform:
          aws:
            region: $(params.AWS_REGION)
            userTags:
              pipelines-ci: "true"
              installer: aws-ipi
              cluster-name: "${CLUSTER_NAME}"
              created-at: "${CREATED_AT}"
              created-by: "${HOSTNAME%%.*}"
              cluster-lifetime: "$(params.CLUSTER_LIFETIME)"
        pullSecret: '${PULL_SECRET}'
        sshKey: '${SSH_PUBLIC_KEY}'
        EOCFG

        sed -i 's/^        //' install-dir/install-config.yaml

        echo "=== Creating cluster ${CLUSTER_NAME} on $(params.BASE_DOMAIN) ==="
        openshift-install create cluster --dir=install-dir --log-level=info 2>&1 | tee install.log

        API_URL="$(oc config view --kubeconfig=install-dir/auth/kubeconfig --minify -o jsonpath='{.clusters[0].cluster.server}')"

        echo "=== Creating cluster secret ==="
        oc create secret generic "cluster-${CLUSTER_NAME}" \
          --from-literal=installer=aws-ipi \
          --from-literal=api-url="${API_URL}" \
          --from-literal=admin-name=kubeadmin \
          --from-literal=kubeadmin-password="$(cat install-dir/auth/kubeadmin-password)" \
          --from-literal=user-password=user --from-literal=admin-token="" \
          --from-literal=insecure-skip-tls-verify=true --from-literal=mirror-reg=quay.io \
          --from-literal=cluster-name="${CLUSTER_NAME}" \
          --from-literal=base-domain="$(params.BASE_DOMAIN)" \
          --from-literal=aws-region="$(params.AWS_REGION)" \
          --from-literal=created-at="${CREATED_AT}" \
          --from-file=kubeconfig=install-dir/auth/kubeconfig \
          --from-file=metadata.json=install-dir/metadata.json
        oc label secret "cluster-${CLUSTER_NAME}" pipelines-ci=true installer=aws-ipi --overwrite

        echo -n "${CLUSTER_NAME}" > "$(results.cluster-name.path)"
        echo -n "aws-ipi" > "$(results.installer.path)"
        echo -n "${API_URL}" > "$(results.api-url.path)"
        echo -n "quay.io" > "$(results.mirror-registry.path)"
        echo "=== AWS IPI cluster ${CLUSTER_NAME} provisioned ==="
      volumeMounts:
        - name: work
          mountPath: /mnt

    # ============================================================
    # Step 2: ARO provisioning
    # ============================================================
    - name: aro
      onError: continue
      image: quay.io/openshift-pipeline/ci:latest
      workingDir: /mnt
      env:
        - name: AZURE_TENANT
          valueFrom:
            secretKeyRef:
              name: azure-creds
              key: azure-tenant
              optional: true
        - name: AZURE_USERNAME
          valueFrom:
            secretKeyRef:
              name: azure-creds
              key: azure-username
              optional: true
        - name: AZURE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: azure-creds
              key: azure-password
              optional: true
        - name: PULL_SECRET
          valueFrom:
            secretKeyRef:
              name: aws-install-config
              key: pull-secret
              optional: true
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        INSTALLER="$(params.INSTALLER)"
        if [[ "${INSTALLER,,}" != "aro" ]]; then
          echo "INSTALLER=${INSTALLER} — not aro, skipping"
          exit 0
        fi

        # Install Azure CLI (only runs when INSTALLER=aro)
        if ! command -v az &>/dev/null; then
          echo "Installing Azure CLI..."
          pip3 install --no-cache-dir azure-cli 2>&1 | tail -1
        fi

        CLUSTER_PREFIX="$(params.CLUSTER_NAME)"
        LOCATION="$(params.AZURE_LOCATION)"

        # Reuse existing cluster
        if oc get secret "cluster-${CLUSTER_PREFIX}" &>/dev/null 2>&1; then
          REUSE_API=$(oc get secret "cluster-${CLUSTER_PREFIX}" -o go-template='{{index .data "api-url" | base64decode}}' 2>/dev/null || true)
          echo "Secret cluster-${CLUSTER_PREFIX} found (API: ${REUSE_API})"
          if curl -sk --connect-timeout 10 "${REUSE_API}/healthz" &>/dev/null; then
            echo "  Cluster alive — reusing"
            echo -n "${CLUSTER_PREFIX}" > "$(results.cluster-name.path)"
            echo -n "aro" > "$(results.installer.path)"
            echo -n "${REUSE_API}" > "$(results.api-url.path)"
            exit 0
          else
            echo "  API unreachable — deleting stale secret"
            oc delete secret "cluster-${CLUSTER_PREFIX}" --ignore-not-found 2>/dev/null || true
          fi
        fi

        CLUSTER_SUFFIX="$(date +%m%d)$(echo '$(context.taskRun.uid)' | cut -c1-3)"
        CLUSTER_NAME="${CLUSTER_PREFIX}${CLUSTER_SUFFIX}"
        CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        echo -n "${CLUSTER_NAME}" > "$(results.cluster-name.path)"
        echo -n "aro" > "$(results.installer.path)"

        [[ -n "${AZURE_TENANT:-}" ]] || { echo "ERROR: AZURE_TENANT not set (azure-creds secret missing?)"; exit 1; }
        [[ -n "${AZURE_USERNAME:-}" ]] || { echo "ERROR: AZURE_USERNAME not set"; exit 1; }
        [[ -n "${AZURE_PASSWORD:-}" ]] || { echo "ERROR: AZURE_PASSWORD not set"; exit 1; }

        echo "=== Logging in to Azure ==="
        az login --service-principal -u "$AZURE_USERNAME" -p "$AZURE_PASSWORD" --tenant "$AZURE_TENANT"

        echo "=== Checking supported OCP versions ==="
        SUPPORTED_OCP_VERSIONS=$(az aro get-versions --location="$LOCATION" | jq -r '.[]')
        echo "Supported: ${SUPPORTED_OCP_VERSIONS}"

        OCP_VERSION="$(params.OPENSHIFT_VERSION)"
        if [[ -z "$OCP_VERSION" || "$OCP_VERSION" == "stable" ]]; then
          echo "ERROR: OPENSHIFT_VERSION must be a specific version for ARO (e.g. 4.15), not 'stable'"
          exit 1
        fi
        DESIRED=$(echo "$SUPPORTED_OCP_VERSIONS" | { grep "^${OCP_VERSION}" || true; })
        if [[ -z "$DESIRED" ]]; then
          echo "ERROR: Version ${OCP_VERSION} not supported on ARO. Available: ${SUPPORTED_OCP_VERSIONS}"
          exit 1
        fi
        echo "Using OCP version: ${DESIRED}"

        echo "=== Creating resource group ${CLUSTER_NAME}-rg ==="
        az group create --name "${CLUSTER_NAME}-rg" --location "$LOCATION"

        echo "=== Creating virtual network ==="
        az network vnet create --resource-group "${CLUSTER_NAME}-rg" --name aro-vnet --address-prefixes 10.0.0.0/22

        echo "=== Creating master subnet ==="
        az network vnet subnet create --resource-group "${CLUSTER_NAME}-rg" --vnet-name aro-vnet \
          --name master-subnet --address-prefixes 10.0.0.0/23

        echo "=== Creating worker subnet ==="
        az network vnet subnet create --resource-group "${CLUSTER_NAME}-rg" --vnet-name aro-vnet \
          --name worker-subnet --address-prefixes 10.0.2.0/23

        echo "=== Creating ARO cluster (30-45 min) ==="
        ARO_ARGS=(
          --resource-group "${CLUSTER_NAME}-rg"
          --name "${CLUSTER_NAME}"
          --vnet aro-vnet
          --master-subnet master-subnet
          --worker-subnet worker-subnet
          --version "$DESIRED"
          --client-id "$AZURE_USERNAME"
          --client-secret "$AZURE_PASSWORD"
          --master-vm-size Standard_D8s_v3
          --worker-vm-size Standard_D4s_v3
          --worker-count 3
        )
        if [[ -n "${PULL_SECRET:-}" ]]; then
          echo "$PULL_SECRET" > /tmp/pull-secret.json
          ARO_ARGS+=(--pull-secret @/tmp/pull-secret.json)
        fi
        az aro create "${ARO_ARGS[@]}"

        echo "=== Extracting credentials ==="
        ADMIN_PASSWORD=$(az aro list-credentials --name "$CLUSTER_NAME" --resource-group "${CLUSTER_NAME}-rg" --query kubeadminPassword -o tsv)
        API_URL=$(az aro show --name "$CLUSTER_NAME" --resource-group "${CLUSTER_NAME}-rg" --query "apiserverProfile.url" -o tsv)
        CONSOLE_URL=$(az aro show --name "$CLUSTER_NAME" --resource-group "${CLUSTER_NAME}-rg" --query "consoleProfile.url" -o tsv)
        echo -n "${API_URL}" > "$(results.api-url.path)"
        echo -n "quay.io" > "$(results.mirror-registry.path)"

        echo "=== Getting kubeconfig ==="
        mkdir -p auth
        az aro get-admin-kubeconfig --name "$CLUSTER_NAME" --resource-group "${CLUSTER_NAME}-rg" --file auth/kubeconfig

        echo "=== Creating cluster secret ==="
        # oc may not be in azure-cli image; write secret YAML directly
        cat > /tmp/cluster-secret.yaml <<EOSECRET
        apiVersion: v1
        kind: Secret
        metadata:
          name: cluster-${CLUSTER_NAME}
          labels:
            pipelines-ci: "true"
            installer: aro
        type: Opaque
        stringData:
          installer: aro
          api-url: "${API_URL}"
          admin-name: kubeadmin
          kubeadmin-password: "${ADMIN_PASSWORD}"
          user-password: user
          admin-token: ""
          insecure-skip-tls-verify: "true"
          mirror-reg: quay.io
          cluster-name: "${CLUSTER_NAME}"
          resource-group: "${CLUSTER_NAME}-rg"
          azure-location: "${LOCATION}"
          created-at: "${CREATED_AT}"
        EOSECRET
        sed -i 's/^        //' /tmp/cluster-secret.yaml

        # Try oc first, fall back to kubectl or curl
        if command -v oc &>/dev/null; then
          oc apply -f /tmp/cluster-secret.yaml
        elif command -v kubectl &>/dev/null; then
          kubectl apply -f /tmp/cluster-secret.yaml
        else
          echo "WARNING: no oc/kubectl — secret must be created manually"
          cat /tmp/cluster-secret.yaml
        fi

        echo "=== ARO cluster ${CLUSTER_NAME} provisioned ==="
        echo "API: ${API_URL}"
        echo "Console: ${CONSOLE_URL}"
      volumeMounts:
        - name: work
          mountPath: /mnt

    # ============================================================
    # Step 3: Flexy provisioning (disconnected / custom templates)
    # ============================================================
    - name: flexy
      onError: continue
      image: quay.io/openshift-pipeline/flexy-containerized:v1.16.6
      workingDir: /mnt
      script: |
        #!/usr/bin/env bash
        set -e -u -o pipefail

        INSTALLER="$(params.INSTALLER)"
        if [[ "${INSTALLER,,}" != "flexy" ]]; then
          echo "INSTALLER=${INSTALLER} — not flexy, skipping"
          exit 0
        fi

        [[ -n "$(params.CLUSTER_NAME)" ]] || { echo "ERROR: CLUSTER_NAME required"; exit 1; }
        [[ -n "$(params.TEMPLATE)" ]] || { echo "ERROR: TEMPLATE required for flexy installer"; exit 1; }

        if oc get secret "cluster-$(params.CLUSTER_NAME)" &>/dev/null; then
          echo "Cluster secret cluster-$(params.CLUSTER_NAME) already exists — reusing"
          echo -n "$(params.CLUSTER_NAME)" > "$(results.cluster-name.path)"
          echo -n "flexy" > "$(results.installer.path)"
          oc get secret "cluster-$(params.CLUSTER_NAME)" -o jsonpath='{.data.api-url}' \
            | base64 --decode > "$(results.api-url.path)"
          oc get secret "cluster-$(params.CLUSTER_NAME)" -o jsonpath='{.data.mirror-reg}' \
            | base64 --decode > "$(results.mirror-registry.path)" 2>/dev/null || echo -n "quay.io" > "$(results.mirror-registry.path)"
          exit 0
        fi

        git config --global http.sslVerify false
        export GIT_SSL_NO_VERIFY=true

        cluster_suffix=$(printf '%(%m%d)T'; echo '$(context.taskRun.uid)' | cut -c 1-3)
        CLUSTER_NAME="$(params.CLUSTER_NAME)${cluster_suffix}"
        echo -n "${CLUSTER_NAME}" > cluster-name
        echo -n "$(context.taskRun.namespace)" > namespace
        echo -n "flexy" > installer

        echo "Preparing Flexy configuration"

        while IFS= read -r line; do
          [[ -z "$line" ]] && continue
          export "$line"
        done < /flexy-secrets/ENVIRONMENT

        export BUSHSLICER_PRIVATE_DIR="$(pwd)/config"
        export FLEXY_URI=https://github.com/ppitonak/verification-tests.git
        export FLEXY_BRANCH=psych
        export GIT_PRIVATE_TEMPLATES_BRANCH="$(params.GIT_PRIVATE_TEMPLATES_BRANCH)"
        export GIT_PRIVATE_TEMPLATES_URI="$(params.GIT_PRIVATE_TEMPLATES_URI)"
        export HOME=/home/jenkins
        export INSTANCE_NAME_PREFIX="${CLUSTER_NAME}"
        export LAUNCHER_VARS='$(params.LAUNCHER_VARS)'
        export OCM_CLI_URL_PREFIX=https://github.com/openshift-online/ocm-cli/releases/download/v0.1.60
        export VARIABLES_LOCATION="$(params.TEMPLATE)"

        jq . &>/dev/null <<< "$LAUNCHER_VARS" \
          || { echo "LAUNCHER_VARS must be empty or valid JSON"; exit 1; }

        if [[ -n "$(params.OPENSHIFT_VERSION)" ]]; then
          ARCH=$(echo "$(params.ARCH)" | cut -d"/" -f2)
          MIRROR_URL="https://mirror.openshift.com/pub/openshift-v4/$ARCH/clients/ocp"
          if [[ "$(params.OPENSHIFT_VERSION)" == *dev-preview* ]]; then
            URL="${MIRROR_URL}-$(params.OPENSHIFT_VERSION)"
          else
            URL="${MIRROR_URL}/$(params.OPENSHIFT_VERSION)"
          fi
          PAYLOAD=$(curl -ksSL "${URL}/release.txt" 2>/dev/null | grep "Pull From:" | cut -d" " -f3) \
            || { echo "ERROR: ${URL}/release.txt not found"; exit 1; }
          IMAGE="{\"installer_payload_image\":\"$PAYLOAD\"}"
        fi
        PULL_SECRET_FILE='{"pull_secret_file":"/mnt/config/pull-secret"}'

        EMPTY_JSON='{}'
        LAUNCHER_VARS=$(echo "${IMAGE:-$EMPTY_JSON}" "$LAUNCHER_VARS" | jq -c -s add)
        LAUNCHER_VARS=$(echo "$PULL_SECRET_FILE" "$LAUNCHER_VARS" | jq -c -s add)

        mkdir -p config
        if [[ "$VARIABLES_LOCATION" == *-on-aws* || \
              "$VARIABLES_LOCATION" == *-on-gcp* || \
              "$VARIABLES_LOCATION" == *-on-osp* ]]; then
          cp /flexy-secrets/* config/
        else
          echo "Only AWS, GCP and PSI templates are supported."
          exit 2
        fi

        archive_artifacts() {
          echo "Archiving cluster metadata"
          if [ ! -f installer-artifacts.zip ]; then
            /usr/local/bin/install_entrypoint.sh archive-artifacts || true
          fi
          SRC_DIR=$(pwd)/flexy/workdir/install-dir

          for FILE in "$SRC_DIR/auth" "$SRC_DIR/metadata.json" "$SRC_DIR/cluster_info.json" \
                      "$SRC_DIR/fips_info" "$SRC_DIR/pre_action" "flexy/users.spec" "flexy/vminfo.yml"; do
            [[ -f "${FILE}" || -d "${FILE}" ]] && cp -r "${FILE}" . || true
          done

          if [ -f "$SRC_DIR/OCPINFO.yml" ]; then
            mkdir -p auth
            grep password "$SRC_DIR/OCPINFO.yml" | cut -d' ' -f2 > auth/kubeadmin-password
            grep ocp_api_url "$SRC_DIR/OCPINFO.yml" | cut -d' ' -f2 > auth/api-url
          else
            mkdir -p auth
            oc config view --kubeconfig="$SRC_DIR/auth/kubeconfig" --minify \
              -o jsonpath='{.clusters[0].cluster.server}' > auth/api-url
          fi

          if [ -f "$SRC_DIR/cf_stack_output" ]; then
            MIRROR_REG=$(grep my_IntSvc_PublicDnsName "$SRC_DIR/cf_stack_output" | cut -d "=" -f2)
            echo -n "${MIRROR_REG}:5000" > mirror-reg
            echo -n "${MIRROR_REG}:5000" | tee "$(results.mirror-registry.path)"
          else
            echo -n "quay.io" > mirror-reg
            echo -n "quay.io" > "$(results.mirror-registry.path)"
          fi

          echo -n "$(cat auth/api-url)" > "$(results.api-url.path)"
        }
        trap archive_artifacts ERR EXIT

        echo "=== Installing cluster with Flexy template: ${VARIABLES_LOCATION} ==="
        /usr/local/bin/install_entrypoint.sh install

        echo "=== Creating cluster secret ==="
        # Reset to in-cluster credentials (Flexy may have altered KUBECONFIG)
        unset KUBECONFIG
        export HOME=/tmp
        OC_ARGS="--server=https://kubernetes.default.svc --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token) --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt -n $(context.taskRun.namespace)"
        oc create secret generic "cluster-${CLUSTER_NAME}" \
          --from-literal=installer=flexy \
          --from-literal=api-url="$(cat auth/api-url)" \
          --from-literal=admin-name=kubeadmin \
          --from-literal=kubeadmin-password="$(cat auth/kubeadmin-password)" \
          --from-literal=user-password=user --from-literal=admin-token="" \
          --from-literal=insecure-skip-tls-verify=true \
          --from-literal=mirror-reg="$(cat mirror-reg)" \
          --from-literal=cluster-name="${CLUSTER_NAME}" \
          --from-file=metadata.json=metadata.json $OC_ARGS || true
        oc label secret "cluster-${CLUSTER_NAME}" pipelines-ci=true installer=flexy --overwrite $OC_ARGS || true

        if [[ -f pre_action/aws_sg_ids_cluster ]]; then
          oc patch secret "cluster-${CLUSTER_NAME}" \
            --type=merge -p "{\"data\":{\"aws_sg_ids_cluster\":\"$(base64 -w0 pre_action/aws_sg_ids_cluster)\"}}" $OC_ARGS || true
        fi

        echo -n "${CLUSTER_NAME}" > "$(results.cluster-name.path)"
        echo -n "flexy" > "$(results.installer.path)"
        echo "=== Flexy cluster ${CLUSTER_NAME} provisioned ==="
      computeResources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 8Gi
      volumeMounts:
        - name: work
          mountPath: /mnt
        - name: flexy-secrets
          mountPath: /flexy-secrets

    # ============================================================
    # Step 4: Skip provisioning (cluster-platforms / none)
    # ============================================================
    - name: skip-provision
      image: quay.io/openshift-pipeline/ci:latest
      workingDir: /mnt
      script: |
        #!/usr/bin/env bash
        INSTALLER="$(params.INSTALLER)"
        INSTALLER="${INSTALLER,,}"

        # If results already set by aws-ipi or aro step, exit
        if [[ -s "$(results.cluster-name.path)" ]]; then
          echo "Cluster already provisioned by previous step"
          exit 0
        fi

        # If installer requires provisioning but previous step failed, fail explicitly
        case "$INSTALLER" in
          aws-ipi|aro|rosa|flexy)
            echo "ERROR: INSTALLER=${INSTALLER} provisioning step failed — check aws-ipi/aro step logs"
            echo "  Ensure aws-creds, aws-install-config (or azure-creds) secrets exist in pipelines-ci"
            exit 1
            ;;
        esac

        echo "INSTALLER=${INSTALLER} — using existing cluster"
        echo -n "$(params.CLUSTER_NAME)" > "$(results.cluster-name.path)"
        echo -n "${INSTALLER}" > "$(results.installer.path)"
        oc get secret "cluster-$(params.CLUSTER_NAME)" -o jsonpath='{.data.api-url}' \
          | base64 -d > "$(results.api-url.path)" 2>/dev/null || echo -n "" > "$(results.api-url.path)"
        MIRROR_REG=$(oc get secret "cluster-$(params.CLUSTER_NAME)" -o go-template='{{index .data "mirror-reg" | base64decode}}' 2>/dev/null || echo "quay.io")
        echo -n "${MIRROR_REG}" > "$(results.mirror-registry.path)"
      volumeMounts:
        - name: work
          mountPath: /mnt

  volumes:
    - name: work
      emptyDir: {}
    - name: flexy-secrets
      secret:
        optional: true
        secretName: flexy
